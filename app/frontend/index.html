<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ec" />
    <title>Quantum Randomness Lab — see where randomness comes from</title>
    <meta
      name="description"
      content="Don't just see the random number — see where the randomness comes from. PRNG vs real-hardware quantum QRNG, visualized: |0⟩ → H → measure → bits."
    />
    <script>
      /* no-flash theme bootstrap (mirrors src/theme.ts) */
      (function () {
        try {
          var t = localStorage.getItem('qrl-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
